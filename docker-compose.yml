# Production shape: Courier joins the shared demo network and reaches the
# target by its service name over that network.
#
# Two things here are load-bearing and look like style until they bite:
#
#   1. The service is `courier`, not `app`. PokéSearch's service is `app`, and
#      two services with the same name on one shared network is a DNS collision.
#   2. `networks: demo: {}` is the mapping form, not the list form `[demo]`.
#      Compose cannot merge a list against a mapping across `-f` files, so the
#      list form would make docker-compose.dev.yml fail to merge.
services:
  courier:
    build: .
    ports:
      - "${APP_PORT:-8084}:8080"
    environment:
      - TARGET_URL=${TARGET_URL:-http://pokesearch:8080}
      - TARGET_DISPLAY=${TARGET_DISPLAY:-pokesearch.andrestheperez.com}
    restart: unless-stopped
    mem_limit: 256m
    # The README measures a maximum run at about 10% of one core. This is that
    # claim as a limit rather than a hope, with headroom for the rest of the
    # process. A healthcheck belongs here too and cannot be written yet: the
    # image has no shell and the binary has no self-probe mode.
    cpus: "0.5"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    networks:
      demo: {}

networks:
  demo:
    external: true
    name: demo-net
