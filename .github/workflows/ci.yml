name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: vet · test -race · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go mod tidy changed go.mod/go.sum - commit the result:"
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The Dockerfile lands in Phase 7 (Task 22). Until then this job is a
      # no-op so CI is green from the scaffold commit onward; it starts
      # exercising the real multi-stage build the moment the file exists.
      - name: Detect Dockerfile
        id: detect
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Dockerfile yet (arrives in Phase 7, Task 22) - skipping image build."
          fi

      - name: Set up Buildx
        if: steps.detect.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.detect.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: courier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
